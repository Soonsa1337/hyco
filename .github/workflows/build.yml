# Baut den Windows-Installer automatisch auf einem GitHub-Windows-Rechner
# und veröffentlicht ihn als Release mit Download-Link.
# Auslöser: ein Tag wie v1.7.0 (oder manuell über "Run workflow").
name: Windows-Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Installer bauen
        run: npm run dist:win

      - name: Installer als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: Hyco-Setup
          path: release/*.exe

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Hyco ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.blockmap
