# Baut den Windows-Installer automatisch auf einem GitHub-Windows-Rechner
# und veröffentlicht ihn als Release mit Download-Link.
# Auslöser: jeder Push auf main. Das Release heißt nach der Version in package.json.
name: Windows-Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Version lesen
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Native Audio-Komponente bauen (WASAPI Process Loopback)
        run: npm run build:native

      - name: Installer bauen
        run: npm run dist:win

      - name: Installer als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: Hyco-Setup
          path: release/*.exe

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Hyco ${{ steps.v.outputs.version }}
          files: |
            release/*.exe
            release/*.blockmap
